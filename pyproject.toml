[project]
name = "pulsar-data-collection"
version = "0.5.1"
description = "sdk enabling data collection from model serving code for our MPM solution"
authors = [{ name = "Pulsar team", email = "pulsar@data-rs.io" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
  "influxdb-client[async]>=1.45",
  "pandas>=2.2,<4",
  "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/Rocket-Science-Development/pulsar_data_collection"

[project.optional-dependencies]
genai = [
    "opentelemetry-sdk>=1.30",
]

[dependency-groups]
dev = [
  "bandit>=1.8",
  "black>=24.10",
  "opentelemetry-sdk>=1.30",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-docker>=3.1",
  "pytest-mock>=3.14",
  "ruff>=0.8",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulsar_data_collection"]

[tool.black]
line-length = 130
target-version = ["py312"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E231", "E241"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.bandit]
targets = ["pulsar_data_collection"]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning", "error::pydantic.warnings.PydanticDeprecatedSince20"]
